[package]
name = "dsviz"
version = "0.1.0"
edition = "2021"
description = "WASM plugin behind the dsviz Typst package: a text DSL for data-structure diagrams."
license = "MIT"
repository = "https://github.com/wesleyel/dsviz"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-minimal-protocol = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
